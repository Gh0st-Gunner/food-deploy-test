version: "3.9"

services:
  # PostgreSQL
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vnfood
      POSTGRES_PASSWORD: vnfood
      POSTGRES_DB: vnfood
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vnfood"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO (S3-compatible local storage)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Gateway
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 10800 --workers 4
    ports:
      - "10800:10800"
    volumes:
      - ./front-end/static:/app/front-end/static
      - ./back-end:/app/back-end
    environment:
      PYTHONPATH: /app/back-end
      VNFOOD_DATABASE_URL: postgresql://vnfood:vnfood@db:5432/vnfood
      VNFOOD_REDIS_HOST: redis
      VNFOOD_REDIS_PORT: 6379
      VNFOOD_CELERY_BROKER_URL: redis://redis:6379/0
      VNFOOD_CELERY_RESULT_BACKEND: redis://redis:6379/1
      VNFOOD_S3_ENDPOINT: http://minio:9000
      VNFOOD_S3_ACCESS_KEY: minioadmin
      VNFOOD_S3_SECRET_KEY: minioadmin
      VNFOOD_S3_BUCKET: vn-food-images
      VNFOOD_USDA_API_KEY: ${VNFOOD_USDA_API_KEY:-}
      VNFOOD_OLLAMA_HOST: http://host.docker.internal:11434
      VNFOOD_GEMINI_API_KEY: ${VNFOOD_GEMINI_API_KEY:-}
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Worker: Classification (CPU)
  worker-classification:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A workers.celery_app worker -Q classification --pool=solo --loglevel=info
    volumes:
      - ./back-end:/app/back-end
      - ./models:/app/models
    environment:
      PYTHONPATH: /app/back-end
      VNFOOD_DATABASE_URL: postgresql://vnfood:vnfood@db:5432/vnfood
      VNFOOD_REDIS_HOST: redis
      VNFOOD_CELERY_BROKER_URL: redis://redis:6379/0
      VNFOOD_CELERY_RESULT_BACKEND: redis://redis:6379/1
      VNFOOD_S3_ENDPOINT: http://minio:9000
      VNFOOD_S3_ACCESS_KEY: minioadmin
      VNFOOD_S3_SECRET_KEY: minioadmin
      VNFOOD_S3_BUCKET: vn-food-images
      VNFOOD_WORKER_PRELOAD_MODELS: classification
      VNFOOD_OLLAMA_HOST: http://host.docker.internal:11434
      VNFOOD_GEMINI_API_KEY: ${VNFOOD_GEMINI_API_KEY:-}
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

  # Celery Worker: Detection (GPU recommended)
  worker-detection:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A workers.celery_app worker -Q detection --pool=solo --loglevel=info
    volumes:
      - ./back-end:/app/back-end
      - hf-cache:/root/.cache/huggingface
    environment:
      PYTHONPATH: /app/back-end
      VNFOOD_DATABASE_URL: postgresql://vnfood:vnfood@db:5432/vnfood
      VNFOOD_REDIS_HOST: redis
      VNFOOD_CELERY_BROKER_URL: redis://redis:6379/0
      VNFOOD_CELERY_RESULT_BACKEND: redis://redis:6379/1
      VNFOOD_S3_ENDPOINT: http://minio:9000
      VNFOOD_S3_ACCESS_KEY: minioadmin
      VNFOOD_S3_SECRET_KEY: minioadmin
      VNFOOD_S3_BUCKET: vn-food-images
      VNFOOD_WORKER_PRELOAD_MODELS: "dino,sam2,depth"
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      redis:
        condition: service_healthy

  # Celery Worker: Nutrition (CPU, no GPU)
  worker-nutrition:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A workers.celery_app worker -Q nutrition -c 4 --loglevel=info
    volumes:
      - ./back-end:/app/back-end
    environment:
      PYTHONPATH: /app/back-end
      VNFOOD_DATABASE_URL: postgresql://vnfood:vnfood@db:5432/vnfood
      VNFOOD_REDIS_HOST: redis
      VNFOOD_CELERY_BROKER_URL: redis://redis:6379/0
      VNFOOD_CELERY_RESULT_BACKEND: redis://redis:6379/1
      VNFOOD_S3_ENDPOINT: http://minio:9000
      VNFOOD_S3_ACCESS_KEY: minioadmin
      VNFOOD_S3_SECRET_KEY: minioadmin
      VNFOOD_S3_BUCKET: vn-food-images
      VNFOOD_USDA_API_KEY: ${VNFOOD_USDA_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy

  # Celery Worker: Default (aggregator, lightweight)
  worker-default:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A workers.celery_app worker -Q default -c 2 --loglevel=info
    volumes:
      - ./back-end:/app/back-end
    environment:
      PYTHONPATH: /app/back-end
      VNFOOD_DATABASE_URL: postgresql://vnfood:vnfood@db:5432/vnfood
      VNFOOD_REDIS_HOST: redis
      VNFOOD_CELERY_BROKER_URL: redis://redis:6379/0
      VNFOOD_CELERY_RESULT_BACKEND: redis://redis:6379/1
      VNFOOD_S3_ENDPOINT: http://minio:9000
      VNFOOD_S3_ACCESS_KEY: minioadmin
      VNFOOD_S3_SECRET_KEY: minioadmin
      VNFOOD_S3_BUCKET: vn-food-images
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
  hf-cache: